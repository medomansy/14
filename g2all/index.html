<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المنسي لخدمات البلايستيشن والموبايل - GoldHEN 5.05 / 7.00 - 14.02</title>
<link rel="stylesheet" href="../style.css">
<style>
  .g2-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 24px;
    text-align: center;
  }
  .g2-brand {
    color: #fbbf24;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .g2-sub {
    color: #cbd5e1;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #msgs.g2-status {
    font-size: 24px;
    font-weight: 800;
    color: #fbbf24;
    margin: 28px 0 42px 0;
    line-height: 1.4;
  }
  .g2-thanks {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 16px;
    direction: ltr;
  }
  .g2-thanks a {
    color: #f87171;
    margin: 0 8px;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="g2-wrap">
  <div class="g2-brand">المنسي لخدمات البلايستيشن والموبايل</div>
  <div class="g2-sub">GoldHEN Host (5.05 &amp; 7.00 - 14.02 FW) • م/ محمد المنسي</div>
  <hr>
  <h1 id="msgs" class="g2-status">جاري تحميل GoldHEN v2.4b18.14... يرجى الانتظار</h1>
  <h2 class="g2-thanks">Special Thanks to:<a href="https://twitter.com/_AlAzif">@_AlAzif</a>ChendoChap<a href="https://x.com/Kameleonre_">@Kameleonre_</a>SiSTR0 Abc</h2>
</div>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "تعذر تحميل الملفات! - امسح بيانات المتصفح وأعد تثبيت الكاش ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "مخصص لجهاز PS4 بإصدارات السوفت 5.05 ومن 7.00 إلى 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'إصدار السوفت غير مدعوم: <span style="color: #f87171;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
</body>
</html>
