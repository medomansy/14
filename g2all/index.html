<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المنسي لخدمات البلايستيشن والموبايل - GoldHEN 5.05 / 7.00 - 14.02</title>
<link rel="stylesheet" href="../style.css">
<style>
  .g2-wrap {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 14px 20px;
    text-align: center;
  }
  .g2-brand {
    font-size: 30px;
    font-weight: 900;
    color: #fbbf24;
    margin-bottom: 10px;
    line-height: 1.25;
  }
  .g2-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    margin-bottom: 14px;
  }
  .g2-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .g2-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: rgba(24, 28, 38, 0.92);
    border: 1px solid rgba(251, 191, 36, 0.45);
    color: #f8fafc;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 13px;
    border-radius: 50px;
  }
  .g2-pill-gold {
    color: #fbbf24;
  }
  .g2-pill-phone {
    color: #ffffff;
    direction: ltr;
  }
  .g2-dot-green {
    width: 8px;
    height: 8px;
    background-color: #22c55e;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  #msgs.g2-status {
    font-size: 22px;
    font-weight: 800;
    color: #fbbf24;
    margin: 26px 0 34px 0;
    line-height: 1.4;
  }
  .g2-credit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #fbbf24;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="g2-wrap">
  <h1 class="g2-brand">المنسي لخدمات البلايستيشن والموبايل</h1>
  <div class="g2-stack">
    <div class="g2-row">
      <span class="g2-pill g2-pill-gold">بيع</span>
      <span class="g2-pill g2-pill-gold">صيانة</span>
      <span class="g2-pill g2-pill-gold">ألعاب</span>
    </div>
    <div class="g2-row">
      <span class="g2-pill g2-pill-gold">م/ محمد المنسي</span>
      <span class="g2-pill g2-pill-phone">01065670546</span>
    </div>
    <div class="g2-row">
      <span class="g2-pill g2-pill-gold">
        <span class="g2-dot-green"></span>
        <span>تفعيلة جميع السوفتات 7.00 - 14.02</span>
      </span>
    </div>
  </div>
  <hr>
  <h2 id="msgs" class="g2-status">جاري تحميل GoldHEN v2.4b18.14... يرجى الانتظار</h2>
  <div class="g2-credit">
    <span class="g2-dot-green"></span>
    <span>تم التعديل والتطوير بواسطة مهندس محمد المنسي</span>
    <span class="g2-dot-green"></span>
  </div>
</div>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "تعذر تحميل الملفات! - امسح بيانات المتصفح وأعد تثبيت الكاش ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "مخصص لجهاز PS4 بإصدارات السوفت 5.05 ومن 7.00 إلى 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'إصدار السوفت غير مدعوم: <span style="color: #f87171;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
</body>
</html>
